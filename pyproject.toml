[project]
name = "chatwoot-autoreply-bot"
version = "0.1.0"
description = "A Chatwoot Agent Bot that answers pending conversations with an OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pressingly" }]
keywords = ["chatwoot", "agent-bot", "llm", "support", "webhook"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "redis>=5",
    "openai>=1.50",
    "cryptography>=44",
]

[project.urls]
Repository = "https://github.com/Pressingly/chatwoot-autoreply-bot"
Issues = "https://github.com/Pressingly/chatwoot-autoreply-bot/issues"

[project.scripts]
chatwoot-autoreply-bot = "chatwoot_autoreply_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "fakeredis[lua]>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatwoot_autoreply_bot"]

[tool.uv]
exclude-newer = "2026-11-04T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["chatwoot_autoreply_bot"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
